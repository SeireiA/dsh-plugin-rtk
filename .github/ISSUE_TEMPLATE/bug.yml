name: Bug report
description: 报告可复现的插件缺陷
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请删除命令中的凭据、Token 和用户私有路径。
  - type: input
    id: version
    attributes:
      label: 插件版本
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Windows x64
        - macOS x64
        - macOS arm64
        - Linux x64
        - Linux arm64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
